name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Check out aesthetics
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: aesthetics
      - name: Check out knowledge engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: noetheca/knowledge-engine
          path: knowledge-engine
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: aesthetics/.node-version
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install engine dependencies
        run: pnpm --dir knowledge-engine install --frozen-lockfile
      - name: Build engine
        run: pnpm --dir knowledge-engine build
      - name: Install domain dependencies
        run: pnpm --dir aesthetics install --frozen-lockfile
      - name: Run checks
        run: pnpm --dir aesthetics check
